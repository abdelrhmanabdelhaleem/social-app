<div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
  <form [formGroup]="postForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Top Input Area -->
    <div class="flex items-start gap-3">
      <img
        src="https://pub-3cba56bacf9f4965bbb0989e07dada12.r2.dev/linkedPosts/default-profile.png"
        alt="User Profile"
        class="w-10 h-10 rounded-full object-cover border border-slate-200 mt-1"
      />
      <div class="flex-1">
        <textarea
          formControlName="body"
          rows="2"
          placeholder="What's on your mind? @mention"
          class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all resize-none"
        ></textarea>
      </div>
    </div>

    <!-- Image Preview Container (FileReader result) -->
    @if (imagePreview) {
      <div class="relative rounded-xl overflow-hidden border border-slate-200 max-h-60 bg-slate-50">
        <img [src]="imagePreview" alt="Preview Image" class="w-full object-cover max-h-60" />
        <button
          type="button"
          (click)="removeImage()"
          class="absolute top-2 right-2 bg-slate-900/70 text-white rounded-full p-1.5 hover:bg-slate-900 transition-colors cursor-pointer"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      </div>
    }

    <!-- Hidden File Input -->
    <input
      type="file"
      #fileInput
      class="hidden"
      accept="image/*"
      (change)="onFileSelected($event)"
    />

    <!-- Action Buttons & Submit -->
    <div class="flex items-center justify-between pt-3 border-t border-slate-100 flex-wrap gap-2">
      <div class="flex items-center gap-1 sm:gap-2">
        <!-- Photo/video Button -->
        <button
          type="button"
          (click)="triggerFileUpload(fileInput)"
          class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer"
        >
          <svg
            class="w-5 h-5 text-emerald-500"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
            />
          </svg>
          <span>Photo/video</span>
        </button>

        <!-- Feeling/activity Button -->
        <button
          type="button"
          class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer"
        >
          <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          <span>Feeling/activity</span>
        </button>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="isLoading || (postForm.invalid && !selectedImage)"
        class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2 rounded-xl text-sm transition-colors cursor-pointer disabled:opacity-50 flex items-center gap-2"
      >
        @if (isLoading) {
          <span>Posting...</span>
        } @else {
          <span>Post</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
            />
          </svg>
        }
      </button>
    </div>
  </form>
</div>
