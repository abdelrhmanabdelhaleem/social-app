<nav class="bg-white border-b border-slate-200 sticky top-0 z-50 px-4 lg:px-8 py-3">
  <div class="max-w-7xl mx-auto flex items-center justify-between">
    <!-- Left Section: Brand Logo & Title -->
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 bg-blue-900 rounded-xl flex items-center justify-center text-white font-black text-xs tracking-tighter"
      >
        ROUTE
      </div>
      <span class="text-xl font-extrabold text-blue-950 tracking-tight">Route Posts</span>
    </div>

    <!-- Center Section: Navigation Pill Bar -->
    <div
      class="hidden md:flex items-center bg-slate-100 p-1 rounded-full border border-slate-200/80 gap-1"
    >
      <!-- Feed Tab -->
      <a
        routerLink="/feed"
        routerLinkActive="  bg-white shadow-sm border border-slate-200/60 font-bold text-blue-600"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-2 px-5 py-2 rounded-full text-sm font-semibold hover:text-blue-600 transition-all group"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
          />
        </svg>
        <span>Feed</span>
      </a>

      <!-- Profile Tab -->
      <a
        routerLink="/profile"
        routerLinkActive="bg-white text-blue-600 shadow-sm border border-slate-200/60 font-bold"
        class="flex items-center gap-2 px-5 py-2 rounded-full text-sm font-semibold hover:text-blue-600 transition-all group"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
          />
        </svg>
        <span>Profile</span>
      </a>

      <!-- Notifications Tab -->
      <a
        routerLink="/notifications"
        routerLinkActive="bg-white text-blue-600 shadow-sm border border-slate-200/60 font-bold"
        class="flex items-center gap-2 px-5 py-2 rounded-full text-sm font-semibold hover:text-blue-600 transition-all group"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"
          />
        </svg>
        <span>Notifications</span>
      </a>
    </div>

    <!-- Right Section: User Profile Dropdown Button -->
    <div class="relative">
      <button
        (click)="toggleDropdown()"
        type="button"
        class="flex items-center gap-2.5 bg-slate-50 hover:bg-slate-100 border border-slate-200 pl-1.5 pr-3 py-1.5 rounded-full transition-all cursor-pointer"
      >
        <img
          src="https://pub-3cba56bacf9f4965bbb0989e07dada12.r2.dev/linkedPosts/default-profile.png"
          alt="User Profile"
          class="w-8 h-8 rounded-full object-cover border border-slate-200"
        />
        <span class="text-sm font-bold text-slate-700 hidden sm:inline-block"
          >Aut nobis dolore rer</span
        >
        <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>

      <!-- Dropdown Menu -->
      @if (isDropdownOpen) {
        <div
          class="absolute right-0 mt-2 w-48 bg-white rounded-2xl shadow-xl border border-slate-100 py-2 z-50 transition-all"
        >
          <a
            routerLink="/profile"
            (click)="closeDropdown()"
            class="flex items-center gap-3 px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors"
          >
            <svg
              class="w-4 h-4 text-slate-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
            <span>Profile</span>
          </a>

          <a
            routerLink="/settings"
            (click)="closeDropdown()"
            class="flex items-center gap-3 px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors"
          >
            <svg
              class="w-4 h-4 text-slate-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            <span>Settings</span>
          </a>

          <hr class="my-1 border-slate-100" />

          <button
            (click)="logout()"
            type="button"
            class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-bold text-rose-600 hover:bg-rose-50 transition-colors cursor-pointer text-left"
          >
            <span>Logout</span>
          </button>
        </div>
      }
    </div>
  </div>
</nav>
